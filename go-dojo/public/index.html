<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go Dojo</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">{ }</span> Go Dojo</div>
    <div class="crumb" id="crumb"></div>
    <div class="chips">
      <span class="chip" id="chip-progress" title="Solved exercises"></span>
      <span class="chip" id="chip-compiler" title="Go toolchain used for Run and Test"></span>
      <span class="chip" id="chip-tutor" title="Tutor model (Ollama)"></span>
    </div>
  </header>

  <main class="main" id="main">
    <!-- Left: exercise -->
    <section class="pane left" aria-label="Exercise">
      <nav class="tabs" role="tablist">
        <button role="tab" class="tab active" data-tab="exercise">Exercise</button>
        <button role="tab" class="tab" data-tab="path">Path <span class="badge hidden" id="due-badge"></span></button>
      </nav>
      <div class="tabpane scroll" id="tab-exercise">
        <div id="ex-head"></div>
        <div id="ex-results"></div>
        <div id="ex-prompt" class="prose"></div>
        <div id="ex-hints"></div>
      </div>
      <div class="tabpane scroll hidden" id="tab-path"></div>
    </section>

    <div class="splitter v" id="split-left" role="separator" aria-orientation="vertical"></div>

    <!-- Center: editor + terminal -->
    <section class="center" aria-label="Code">
      <div class="toolbar">
        <button class="btn primary" id="btn-test" title="Run the exercise's tests (Ctrl/Cmd+Enter)">Run tests</button>
        <button class="btn" id="btn-run" title="Run your own main() (Ctrl/Cmd+Shift+Enter)">Run</button>
        <button class="btn danger hidden" id="btn-stop" title="Stop the running program (Ctrl+C in the terminal)">Stop</button>
        <button class="btn ghost" id="btn-format" title="Format the file with gofmt (Shift+Alt+F)">gofmt</button>
        <span class="spacer"></span>
        <label class="toggle" title="Autocomplete is off by default so you practise recalling syntax"><input type="checkbox" id="opt-suggest"> Autocomplete</label>
        <span class="save-state" id="save-state"></span>
        <button class="btn ghost" id="btn-review" title="Start this exercise again from a blank file">Practise again</button>
        <button class="btn ghost" id="btn-reset" title="Replace your code with the starter file (your code is archived)">Reset</button>
      </div>
      <div class="editor-wrap"><div id="editor"></div></div>
      <div class="splitter h" id="split-term" role="separator" aria-orientation="horizontal"></div>
      <div class="terminal-wrap">
        <div class="terminal-head"><span>Terminal</span><button class="btn ghost small" id="btn-clear">Clear</button></div>
        <div id="terminal"></div>
      </div>
    </section>

    <div class="splitter v" id="split-right" role="separator" aria-orientation="vertical"></div>

    <!-- Right: tutor chat -->
    <aside class="pane right" aria-label="Tutor">
      <div class="chat-head">
        <div class="chat-title">Tutor</div>
        <div class="seg" id="mode-seg" role="group" aria-label="Tutor mode">
          <button data-mode="socratic" class="active" title="Questions and nudges, no solutions">Socratic</button>
          <button data-mode="explain" title="Explains concepts, still no solution">Explain</button>
          <button data-mode="code" title="May show code, then asks you to retype it">Show code</button>
        </div>
        <select id="model-select" aria-label="Model"></select>
      </div>
      <div class="chat-note hidden" id="chat-note"></div>
      <div class="chat-log scroll" id="chat-log"></div>
      <div class="chat-compose">
        <div class="quick" id="quick"></div>
        <textarea id="chat-input" rows="2" placeholder="Ask a question…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="compose-row">
          <label class="toggle"><input type="checkbox" id="opt-context" checked> Share my code and last output</label>
          <span class="spacer"></span>
          <button class="btn ghost small" id="btn-chat-clear">Clear chat</button>
          <button class="btn primary small" id="btn-send">Send</button>
          <button class="btn danger small hidden" id="btn-chat-stop">Stop</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-head"><strong id="dlg-title"></strong><button class="btn ghost small" id="dlg-close">Close</button></div>
  <div class="dlg-body prose" id="dlg-body"></div>
</dialog>

<!-- xterm must load before Monaco's AMD loader: once `define` exists, UMD bundles register as AMD modules instead of globals. -->
<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/xterm-fit/lib/addon-fit.js"></script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
